api:
  dashboard: true
  insecure: true

log:
  level: DEBUG
  format: json

accessLog:
  format: json
  filePath: "/var/log/traefik/access.log"

middlewares:
  retry:
    retry:
      attempts: 3
      initialInterval: 500ms
      maxInterval: 2000ms
  timeout:
    timeout:
      duration: 10s

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    watch: true
    network: nextgen_local_network

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
