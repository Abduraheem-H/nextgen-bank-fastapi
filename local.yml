services:
  traefik:
    image: "docker.io/traefik:v3.2"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./backend/app/docker/local/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - nextgen_local_network
    command:
      - --providers.docker
  api: &api
    build:
      context: .
      dockerfile: ./backend/app/docker/local/fastapi/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/src
      - ./backend/app/logs:/src/backend/app/logs
    env_file:
      - ./.envs/.env.local
    depends_on:
      - postgres
      - mailpit
      - redis
      - rabbitmq
    networks:
      - nextgen_local_network
    command: ["./backend/app/docker/local/fastapi/start.sh"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.service=api-service"
      - "traefik.http.services.api-service.loadbalancer.server.port=8000"
  mailpit:
    image: "docker.io/axllent/mailpit:v1.20.3"
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - nextgen_mailpit_data:/data
    environment:
      MP_MAX_MESSAGE: 5000
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - nextgen_local_network
    
  postgres:
    build:
      context: .
      dockerfile: ./backend/app/docker/local/postgres/Dockerfile
    ports:
      - "5432:5432"
    volumes:
      - nextgen_local_db:/var/lib/postgresql/data/
    env_file:
      - ./.envs/.env.local
    networks:
      - nextgen_local_network
  redis:
    image: "docker.io/redis:7.0-alpine"
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - nextgen_local_network
  rabbitmq:
    image: "docker.io/rabbitmq:3.13-management"
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    volumes:
      - nextgen_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - nextgen_local_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.localhost`)"
      - "traefik.http.routers.rabbitmq.entrypoints=web"
      - "traefik.http.routers.rabbitmq.service=rabbitmq-service"
      - "traefik.http.services.rabbitmq-service.loadbalancer.server.port=15672"
  celeryworker:
    <<: *api
    command: /celery-worker-start.sh
    labels:
      - "traefik.enable=false"
    ports: [] 

  flower:
    <<: *api
    command: /celery-flower-start.sh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flower.rule=Host(`flower.localhost`)"
      - "traefik.http.routers.flower.entrypoints=web"
      - "traefik.http.routers.flower.service=flower-service"
      - "traefik.http.services.flower-service.loadbalancer.server.port=5555"
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - rabbitmq
    volumes:
      - nextgen_flower_data:/data
  
  celerybeat:
    <<: *api
    command: /celery-beat-start.sh
    labels:
      - "traefik.enable=false"
    ports: []
networks:
  nextgen_local_network:

   
volumes:
  nextgen_local_db:
  nextgen_mailpit_data:
  nextgen_rabbitmq_data:
  nextgen_flower_data:
  
